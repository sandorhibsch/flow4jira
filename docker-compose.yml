services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: flow4jira-app
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: development
      DATABASE_URL:
      JIRA_BASE_URL: ''
      JIRA_PERSONAL_ACCESS_TOKEN: ''
      JIRA_API_TOKEN: ''
      JIRA_EMAIL: ''
      CI: true
    volumes:
      - ./:/app:cached
      - /app/node_modules
      - /root/.pnpm-store
    depends_on:
      - postgres
    command: sh -c "pnpm install && pnpm prisma migrate deploy && pnpm prisma generate && pnpm dev --hostname 0.0.0.0 --port 3000"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: flow4jira_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:

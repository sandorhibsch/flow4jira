services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: flow4jira-app
    ports:
      - '127.0.0.1:3000:3000'
    env_file:
      - .env
    environment:
      # Inside Compose, Postgres is reached through the service hostname, not localhost.
      # A DATABASE_URL in .env overrides this default.
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/flow4jira}
      CI: true
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "pnpm prisma generate && pnpm prisma migrate deploy && pnpm start --hostname 0.0.0.0 --port 3000"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: flow4jira
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:
